name: Auto Sync and Deploy to Cloudflare

permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream latest code (huangxd-/danmu_api)
        uses: actions/checkout@v4
        with:
          repository: huangxd-/danmu_api
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and deploy to Cloudflare Worker
        run: |
          npm install
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
